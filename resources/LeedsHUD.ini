
; ============================================================
; Bully-ish HudUI - LeedsHUD Edition
; Configuration file
; ============================================================


[Settings]

; ------------------------------------------------------------
; HUD theme
; vcs = Vice City Stories
; lcs = Liberty City Stories
; ------------------------------------------------------------
Mode=lcs


; ------------------------------------------------------------
; HUD transparency
; ------------------------------------------------------------

; General HUD indicator alpha
HUDAlpha=200


; ------------------------------------------------------------
; Radar transparency
; ------------------------------------------------------------

; Radar map transparency
RadarMapAlpha=140

; Radar blips transparency
BlipsAlpha=190


; ------------------------------------------------------------
; Radar keyboard controls
; Values use Windows Virtual-Key codes
; ------------------------------------------------------------

; Hold T - temporarily zoom out radar
ZoomOut=0x54

; Press X - toggle expanded radar
ExpandedRadar=0x58


; ------------------------------------------------------------
; Area and vehicle names
; ------------------------------------------------------------

; Hold T - display area and vehicle names
HighlightAreaVehicleNames=0x54


; ------------------------------------------------------------
; Money display
; ------------------------------------------------------------

; Remove leading zeros from money display
; 0 = disabled
; 1 = enabled
MoneyPadZeros=0


; ------------------------------------------------------------
; Crosshair
; ------------------------------------------------------------

; Red crosshair when targeting a ped
; 0 = disabled
; 1 = enabled
CrosshairRedLockOn=0



[Colors]

; ============================================================
; MESSAGES - STATISTICS BARS
; Messages.cpp
; ============================================================

; Custom statistics bar color (RGB)
; All three values must differ from 255 to activate custom color
; 255,255,255 = use default theme colors

MessagesStatsBarR=255
MessagesStatsBarG=255
MessagesStatsBarB=255


; Negative statistics change color (RGB)
; All three values must differ from -1 to activate custom color
; -1,-1,-1 = use default red color

MinusR=-1
MinusG=-1
MinusB=-1



; ============================================================
; PROGRESS BARS - MISSION STATISTICS
; ProgressBar.cpp
; ============================================================

; Mission statistics progress bar color (RGB)
; 255,255,255 = use default theme colors

ProgressBarR=255
ProgressBarG=255
ProgressBarB=255


; ============================================================
; LOADING BAR
; ProgressBar.cpp
; ============================================================

; Loading bar fill color (RGB)
; 255,255,255 = use default theme colors

LoadingBarR=255
LoadingBarG=255
LoadingBarB=255



; ============================================================
; STATS TAB
; Stats.cpp
; ============================================================

; Stats tab progress bars color (RGB)
; 255,255,255 = use default theme colors

StatsR=255
StatsG=255
StatsB=255



; ============================================================
; RADIO STATION TEXT
; Radio.cpp
; ============================================================

; ------------------------------------------------------------
; Normal radio station text color (RGB + Alpha)
; Used while scrolling through stations
; ------------------------------------------------------------

ColorNormal_R=30
ColorNormal_G=60
ColorNormal_B=140
ColorNormal_A=255


; ------------------------------------------------------------
; Active radio station text color (RGB + Alpha)
; Used for the currently selected station
; ------------------------------------------------------------

ColorActive_R=100
ColorActive_G=180
ColorActive_B=255
ColorActive_A=255


; ------------------------------------------------------------
; Radio station text position
; PosX = horizontal offset from screen center
; PosY = vertical position from screen top
; ------------------------------------------------------------

PosX=0.0
PosY=46.0


; ------------------------------------------------------------
; Radio station text scale
; ------------------------------------------------------------

ScaleX=1.30
ScaleY=2.30



; ============================================================
; MANHUNTHUD - PLAYER STATUS ICON
; Main.cpp
; ============================================================

[ManhuntHUD]

; Player status icon horizontal offset
StatusOffsetX=-1455.0

; Player status icon vertical offset
StatusOffsetY=-151.0

; Player status icon scale
StatusScale=0.65
